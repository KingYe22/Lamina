name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update. Empty uses dispatch-<run number>.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macos-14 defaults to Xcode 15.4 (Swift 5.10). Package.swift requires Swift 6.
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version

      - name: Unit tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: >
          xcodebuild
          -project Lamina.xcodeproj
          -scheme Lamina
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          ENABLE_HARDENED_RUNTIME=NO
          build

      - name: Package app and disk image
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Lamina.app"
          test -d "$APP"
          rm -rf dist
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/Lamina.app
          swiftc -O -framework AppKit packaging/RenderIcon.swift -o /tmp/render-icon
          rm -rf /tmp/icon.iconset
          mkdir -p /tmp/icon.iconset dist/dmg/Lamina.app/Contents/Resources
          /tmp/render-icon /tmp/AppIcon-1024.png /tmp/icon.iconset
          iconutil -c icns /tmp/icon.iconset -o dist/dmg/Lamina.app/Contents/Resources/AppIcon.icns
          # Drop quarantine before ad-hoc signing so the signature is what ships.
          xattr -cr dist/dmg/Lamina.app || true
          codesign --force --deep --sign - dist/dmg/Lamina.app
          codesign --verify --deep --strict dist/dmg/Lamina.app
          xattr -dr com.apple.quarantine dist/dmg/Lamina.app || true
          cp "packaging/打开 Lamina.command" "dist/dmg/打开 Lamina.command"
          chmod +x "dist/dmg/打开 Lamina.command"
          xattr -cr "dist/dmg/打开 Lamina.command" || true
          ditto -c -k --keepParent dist/dmg/Lamina.app dist/Lamina.app.zip
          hdiutil create -volname Lamina -srcfolder dist/dmg -ov -format UDZO dist/Lamina.dmg
          du -sh dist/dmg/Lamina.app dist/Lamina.dmg

      - name: Smoke test launch window
        run: |
          set -euo pipefail
          APP="dist/dmg/Lamina.app"
          BIN="$APP/Contents/MacOS/Lamina"
          test -x "$BIN"
          swiftc -O -framework CoreGraphics -framework Foundation packaging/SmokeWindows.swift -o /tmp/smoke-windows

          MARKER="$(mktemp)"
          rm -f "$MARKER"
          LAMINA_SMOKE=1 LAMINA_SMOKE_FILE="$MARKER" "$BIN" >/tmp/lamina-smoke.out 2>/tmp/lamina-smoke.err &
          smoke_pid=$!
          ready=0
          for _ in 1 2 3 4 5; do
            if [[ -s "$MARKER" ]]; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "applicationDidFinishLaunching did not write the smoke marker"
            cat /tmp/lamina-smoke.out /tmp/lamina-smoke.err || true
            kill "$smoke_pid" 2>/dev/null || true
            exit 1
          fi
          for _ in 1 2 3 4 5; do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" 2>/dev/null || true

          "$BIN" >/tmp/lamina-window.out 2>/tmp/lamina-window.err &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "app exited before the window check"
            cat /tmp/lamina-window.out /tmp/lamina-window.err || true
            exit 1
          fi
          if ! /tmp/smoke-windows "$pid"; then
            echo "no CGWindowList window owned by pid $pid"
            cat /tmp/lamina-window.out /tmp/lamina-window.err || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Shortcut test
        run: |
          set -euo pipefail
          BIN="dist/dmg/Lamina.app/Contents/MacOS/Lamina"
          RESULT="$(mktemp)"
          rm -f "$RESULT"
          LAMINA_KEYTEST=1 LAMINA_KEYTEST_FILE="$RESULT" "$BIN" >/tmp/lamina-keys.out 2>/tmp/lamina-keys.err &
          pid=$!
          for _ in $(seq 1 60); do
            if [[ -s "$RESULT" ]] && grep -Eq '^(OK|FAIL)$' "$RESULT"; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "----- key test -----"
          cat "$RESULT" || true
          echo "----- stdout/stderr -----"
          cat /tmp/lamina-keys.out /tmp/lamina-keys.err || true
          echo "----- crashes -----"
          ls -lt "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -n 5 || true
          grep -q '^OK$' "$RESULT"

      - name: Capture interface screenshots
        run: |
          set -euo pipefail
          BIN="dist/dmg/Lamina.app/Contents/MacOS/Lamina"
          DIR="$(mktemp -d)"
          LAMINA_SHOTS="$DIR" "$BIN" >/tmp/lamina-shots.out 2>/tmp/lamina-shots.err || true
          cp /tmp/AppIcon-1024.png "$DIR/icon-1024.png"
          ls -l "$DIR"
          test -s "$DIR/home.png"
          test -s "$DIR/new-document.png"
          test -s "$DIR/workspace.png"
          test -s "$DIR/icon-1024.png"
          mkdir -p dist/shots
          cp "$DIR"/*.png dist/shots/

      - uses: actions/upload-artifact@v4
        with:
          name: lamina-screenshots
          if-no-files-found: error
          path: dist/shots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: Lamina-macOS
          if-no-files-found: error
          path: |
            dist/Lamina.dmg
            dist/Lamina.app.zip

      - name: Resolve release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="dispatch-${GITHUB_RUN_NUMBER}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attach app and disk image to the GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            从浏览器下载或从磁盘映像拷出的 Lamina.app 会带隔离标记（com.apple.quarantine）。这个包是 ad-hoc 签名（`codesign --sign -`），不是 Apple 开发者证书，系统可能拒绝直接双击。

            首次打开请任选一种：

            1. 在 Finder 里右键 Lamina.app，选择「打开」，再点对话框里的「打开」。
            2. 把 Lamina.app 放进「应用程序」后，在终端运行：`xattr -cr /Applications/Lamina.app && open /Applications/Lamina.app`
            3. 先把 Lamina.app 拖进「应用程序」，再双击磁盘映像里的「打开 Lamina.command」（它会清除隔离标记并打开应用程序里的 Lamina）。

            Dock 和窗口标题显示为 Lamina。0.2.0 使用基本功能工作区：主页、新建文档和 Illustrator 式工具栏。首次打开若被拦截，右键「打开」，或运行 `xattr -cr /Applications/Lamina.app && open /Applications/Lamina.app`。
          files: |
            dist/Lamina.app.zip
            dist/Lamina.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
