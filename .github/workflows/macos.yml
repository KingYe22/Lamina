name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update. Empty uses dispatch-<run number>.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macos-14 defaults to Xcode 15.4 (Swift 5.10). Package.swift requires Swift 6.
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version

      - name: Reject screenshot paths in app source
        run: |
          set -euo pipefail
          if grep -R -n -E 'ai-ref' Sources project.yml Package.swift; then
            echo "app source must not reference ai-ref"
            exit 1
          fi

      - name: Unit tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: >
          xcodebuild
          -project Lamina.xcodeproj
          -scheme Lamina
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          ENABLE_HARDENED_RUNTIME=NO
          build

      - name: Package app and disk image
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Lamina.app"
          test -d "$APP"
          rm -rf dist
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/Lamina.app
          swiftc -O -framework AppKit packaging/RenderIcon.swift -o /tmp/render-icon
          rm -rf /tmp/icon.iconset
          mkdir -p /tmp/icon.iconset dist/dmg/Lamina.app/Contents/Resources
          /tmp/render-icon packaging/lamina-icon.jpg /tmp/AppIcon-1024.png /tmp/icon.iconset
          iconutil -c icns /tmp/icon.iconset -o dist/dmg/Lamina.app/Contents/Resources/AppIcon.icns
          echo "---- Contents/Resources ----"
          find dist/dmg/Lamina.app/Contents/Resources -type f | sed 's|.*/Contents/Resources/||' | sort
          if find dist/dmg/Lamina.app/Contents/Resources -type f \( -name 'toolbar.png' -o -name 'panels.png' -o -name 'newdoc-details.png' \) | grep -q .; then
            echo "screenshot bitmaps must not ship inside the app"
            exit 1
          fi
          # Drop quarantine before ad-hoc signing so the signature is what ships.
          xattr -cr dist/dmg/Lamina.app || true
          codesign --force --deep --sign - dist/dmg/Lamina.app
          codesign --verify --deep --strict dist/dmg/Lamina.app
          xattr -dr com.apple.quarantine dist/dmg/Lamina.app || true
          cp "packaging/打开 Lamina.command" "dist/dmg/打开 Lamina.command"
          chmod +x "dist/dmg/打开 Lamina.command"
          xattr -cr "dist/dmg/打开 Lamina.command" || true
          ditto -c -k --keepParent dist/dmg/Lamina.app dist/Lamina.app.zip
          hdiutil create -volname Lamina -srcfolder dist/dmg -ov -format UDZO dist/Lamina.dmg
          du -sh dist/dmg/Lamina.app dist/Lamina.dmg

      - name: Install shipped app from the disk image
        id: install
        run: |
          set -euo pipefail
          MOUNT="$(mktemp -d)"
          hdiutil attach dist/Lamina.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          DEST="$(mktemp -d)"
          cp -R "$MOUNT/Lamina.app" "$DEST/Lamina.app"
          hdiutil detach "$MOUNT"
          # The user's 0.2.1 disk image had no shortcut file and no SwiftPM bundle.
          # Delete every copy the temp app could read so only the compiled-in table works.
          find "$DEST/Lamina.app" -name 'adobe_shortcuts_cn.txt' -delete
          rm -rf "$DEST/Lamina.app/Contents/Resources/"*.bundle
          RESOURCE="Sources/LaminaCore/Resources/adobe_shortcuts_cn.txt"
          if [[ -f "$RESOURCE" ]]; then
            mv "$RESOURCE" "$RESOURCE.ci-aside"
          fi
          BIN="$DEST/Lamina.app/Contents/MacOS/Lamina"
          test -x "$BIN"
          if grep -a -q 'adobe_shortcuts_cn.txt' "$BIN"; then
            echo "executable still contains a runtime path to the shortcut file"
            exit 1
          fi
          if ! grep -a -q 'Command + Z' "$BIN"; then
            echo "shortcut table text is not inside the executable"
            exit 1
          fi
          echo "app=$DEST/Lamina.app" >> "$GITHUB_OUTPUT"
          du -sh "$DEST/Lamina.app"

      - name: Smoke test launch window
        run: |
          set -euo pipefail
          APP="${{ steps.install.outputs.app }}"
          BIN="$APP/Contents/MacOS/Lamina"
          test -x "$BIN"
          swiftc -O -framework CoreGraphics -framework Foundation packaging/SmokeWindows.swift -o /tmp/smoke-windows

          MARKER="$(mktemp)"
          rm -f "$MARKER"
          LAMINA_SMOKE=1 LAMINA_SMOKE_FILE="$MARKER" "$BIN" >/tmp/lamina-smoke.out 2>/tmp/lamina-smoke.err &
          smoke_pid=$!
          ready=0
          for _ in 1 2 3 4 5; do
            if [[ -s "$MARKER" ]]; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "applicationDidFinishLaunching did not write the smoke marker"
            cat /tmp/lamina-smoke.out /tmp/lamina-smoke.err || true
            kill "$smoke_pid" 2>/dev/null || true
            exit 1
          fi
          for _ in 1 2 3 4 5; do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" 2>/dev/null || true

          "$BIN" >/tmp/lamina-window.out 2>/tmp/lamina-window.err &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "app exited before the window check"
            cat /tmp/lamina-window.out /tmp/lamina-window.err || true
            exit 1
          fi
          if ! /tmp/smoke-windows "$pid"; then
            echo "no CGWindowList window owned by pid $pid"
            cat /tmp/lamina-window.out /tmp/lamina-window.err || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Shortcut test
        run: |
          set -euo pipefail
          clang -fobjc-arc -O2 -framework Carbon -framework CoreGraphics -framework Foundation packaging/KeyPoster.m -o /tmp/keyposter
          BIN="${{ steps.install.outputs.app }}/Contents/MacOS/Lamina"
          fail=0
          for mode in pinyin abc; do
            STATE="$(mktemp)"
            RESULT="$(mktemp)"
            rm -f "$STATE" "$RESULT"
            LAMINA_KEYTEST=1 LAMINA_KEYTEST_FILE="$STATE" "$BIN" >/tmp/lamina-keys-"$mode".out 2>/tmp/lamina-keys-"$mode".err &
            pid=$!
            ready=0
            for _ in $(seq 1 50); do
              if [[ -s "$STATE" ]] && grep -q 'phase=home' "$STATE"; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            if [[ "$ready" != 1 ]]; then
              echo "app did not reach the home screen ($mode)"
              cat /tmp/lamina-keys-"$mode".out /tmp/lamina-keys-"$mode".err || true
              kill "$pid" 2>/dev/null || true
              fail=1
              break
            fi
            /tmp/keyposter "$mode" "$pid" "$STATE" "$RESULT" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "----- $mode -----"
            cat "$RESULT" || true
            echo "----- app log ($mode) -----"
            cat /tmp/lamina-keys-"$mode".out /tmp/lamina-keys-"$mode".err || true
            echo "----- crashes -----"
            ls -lt "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -n 5 || true
            if ! grep -q '^OK$' "$RESULT"; then fail=1; fi
          done
          exit "$fail"

      - name: Capture interface screenshots
        run: |
          set -euo pipefail
          BIN="${{ steps.install.outputs.app }}/Contents/MacOS/Lamina"
          DIR="$(mktemp -d)"
          LAMINA_SHOTS="$DIR" "$BIN" >/tmp/lamina-shots.out 2>/tmp/lamina-shots.err || true
          cp /tmp/AppIcon-1024.png "$DIR/icon-1024.png"
          ls -l "$DIR"
          test -s "$DIR/home.png"
          test -s "$DIR/new-document.png"
          test -s "$DIR/workspace.png"
          test -s "$DIR/drag-preview.png"
          test -s "$DIR/tooltip.png"
          test -s "$DIR/tool-flyout.png"
          test -s "$DIR/pen-drawing.png"
          test -s "$DIR/icon-1024.png"
          mkdir -p dist/shots
          cp "$DIR"/*.png dist/shots/

      - uses: actions/upload-artifact@v4
        with:
          name: lamina-screenshots
          if-no-files-found: error
          path: dist/shots/*.png

      - name: Compare screenshots with the reference
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow || python3 -m pip install --break-system-packages pillow
          python3 packaging/compare_refs.py dist/shots packaging/ai-ref dist/compare
          ls -l dist/compare

      - uses: actions/upload-artifact@v4
        with:
          name: lamina-compare
          if-no-files-found: error
          path: dist/compare/*

      - uses: actions/upload-artifact@v4
        with:
          name: Lamina-macOS
          if-no-files-found: error
          path: |
            dist/Lamina.dmg
            dist/Lamina.app.zip

      - name: Restore shortcut source file
        if: always()
        run: |
          RESOURCE="Sources/LaminaCore/Resources/adobe_shortcuts_cn.txt"
          if [[ -f "$RESOURCE.ci-aside" ]]; then
            mv "$RESOURCE.ci-aside" "$RESOURCE"
          fi

      - name: Resolve release tag
        id: release
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="dispatch-${GITHUB_RUN_NUMBER}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            git fetch origin "refs/tags/${TAG}" --force
            current="$(git rev-parse "refs/tags/${TAG}^{}")"
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo "tag ${TAG} points at ${current}, this run built ${GITHUB_SHA}; refusing to publish a stale tag"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attach app and disk image to the GitHub Release
        if: success() && steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            从浏览器下载或从磁盘映像拷出的 Lamina.app 会带隔离标记（com.apple.quarantine）。这个包是 ad-hoc 签名（`codesign --sign -`），不是 Apple 开发者证书，系统可能拒绝直接双击。

            首次打开请任选一种：

            1. 在 Finder 里右键 Lamina.app，选择「打开」，再点对话框里的「打开」。
            2. 把 Lamina.app 放进「应用程序」后，在终端运行：`xattr -cr /Applications/Lamina.app && open /Applications/Lamina.app`
            3. 先把 Lamina.app 拖进「应用程序」，再双击磁盘映像里的「打开 Lamina.command」（它会清除隔离标记并打开应用程序里的 Lamina）。

            Dock 和窗口标题显示为 Lamina。0.3.6 仍只用 NSBezierPath 和真实控件，参考图不进 app。工具栏组标题在两列中间，组与组之间有分隔线。可见工具是：绘图为画笔、橡皮擦、画笔刷、钢笔、曲率；修改为形状生成器、旋转、混合；导航为缩放、抓手、旋转视图。图标按参考轮廓描成路径。底部填色、描边、色板和生成式 AI 的双星按截图的位置和尺寸绘制。面板标题和属性栏文字按量到的字号和颜色绘制。对比图从运行中的窗口按 2 倍像素截取。这一版的平均绝对差是：工具栏 3.56，新建文档 10.74，面板 11.47。工具栏低于 8。新建文档和面板仍高于 8，数字没有改过。钢笔拖拽只添加锚点和方向手柄，不再带动窗口。应用图标使用提供的原稿，只套 macOS 圆角蒙版。快捷键表仍编译在程序里。画布获得焦点时绕开输入法，按物理 keyCode 接收快捷键；面板里的数值框只有点击后才获得焦点，Return、Esc 或 Tab 会把焦点还给画布。首次打开若被拦截，右键「打开」，或运行 `xattr -cr /Applications/Lamina.app && open /Applications/Lamina.app`。
          files: |
            dist/Lamina.app.zip
            dist/Lamina.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
